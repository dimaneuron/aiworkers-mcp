[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiworkers-mcp"
version = "0.3.23"
description = "MCP server for AIWorkers / НЕЙРОСОТРУДНИКИ (surveys, tasks, workers, telegram, tg userbot CRM, crm, api.knopka.click)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIWorkers" }]
keywords = ["mcp", "aiworkers", "openclaw", "cursor", "survey", "tasks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.6.0,<2",
  "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://ai.knopka.click/mcp"
Documentation = "https://ai.knopka.click/mcp"
Repository = "https://github.com/dimaneuron/aiworkers-mcp"

[project.scripts]
aiworkers-mcp = "aiworkers_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["aiworkers_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"aiworkers_mcp/SKILL.md" = "aiworkers_mcp/SKILL.md"
